name: Chalk

options:
  bundleIdPrefix: com.placeholder
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "16"
  generateEmptyDirectories: true
  groupSortPosition: top
  defaultConfig: Debug

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""   # ← Fill in your Apple Developer Team ID in Xcode

targets:

  # ───────────────────────────────────────────────────────
  # iOS Application
  # ───────────────────────────────────────────────────────
  Chalk:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Chalk
        excludes:
          - "Widgets/**"
          - "Design/**"
          - "**/.gitkeep"
    entitlements:
      path: Chalk/Chalk.entitlements
    info:
      path: Chalk/Info.plist
      properties:
        CFBundleName: Chalk
        CFBundleDisplayName: Chalk
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSHealthShareUsageDescription: "Chalk reads your workout history to track your weekly goals."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.placeholder.Chalk  # ← Replace with your real bundle ID
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: ChalkWidgetExtension
        embed: true
      - target: ChalkWatch
        embed: true
        codeSign: true

  # ───────────────────────────────────────────────────────
  # WidgetKit Extension
  # ───────────────────────────────────────────────────────
  ChalkWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Chalk/Widgets/ChalkWidgetExtension
        excludes:
          - "**/.gitkeep"
      - path: Chalk/Shared
        excludes:
          - "**/.gitkeep"
    entitlements:
      path: Chalk/Widgets/ChalkWidgetExtension/ChalkWidgetExtension.entitlements
    info:
      path: Chalk/Widgets/ChalkWidgetExtension/Info.plist
      properties:
        CFBundleName: ChalkWidget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.placeholder.Chalk.widget  # ← Replace with your real bundle ID
        APPLICATION_EXTENSION_API_ONLY: YES

  # ───────────────────────────────────────────────────────
  # watchOS Companion App  (Phase 5 placeholder)
  # ───────────────────────────────────────────────────────
  ChalkWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: ChalkWatch
        excludes:
          - "**/.gitkeep"
    info:
      path: ChalkWatch/Info.plist
      properties:
        CFBundleName: Chalk
        WKApplication: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.placeholder.Chalk.watchkitapp  # ← Replace with your real bundle ID
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
