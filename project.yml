name: Chalk

options:
  bundleIdPrefix: com.chalkweekly
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "16"
  generateEmptyDirectories: true
  groupSortPosition: top
  defaultConfig: Debug

configs:
  Debug: debug
  Release: release

# Team ID lives in Config/DevelopmentTeam.xcconfig (gitignored).
# First-time setup: cp Config/DevelopmentTeam.xcconfig.example Config/DevelopmentTeam.xcconfig
configFiles:
  Debug: Config/DevelopmentTeam.xcconfig
  Release: Config/DevelopmentTeam.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic

schemes:

  Chalk:
    build:
      targets:
        Chalk: all
        ChalkWidgetExtension: [build]
        ChalkWatch: [build]
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  ChalkWidgetExtension:
    build:
      targets:
        ChalkWidgetExtension: all
    run:
      config: Debug
    archive:
      config: Release

  ChalkWatch:
    build:
      targets:
        ChalkWatch: all
    run:
      config: Debug
    archive:
      config: Release

targets:

  # ───────────────────────────────────────────────────────
  # iOS Application
  # ───────────────────────────────────────────────────────
  Chalk:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Chalk
        excludes:
          - "Widgets/**"
          - "Design/**"
          - "**/.gitkeep"
          # xcodegen 2.25 does not know folder.iconcomposer.icon (Xcode 26 type).
          # chalk_app_icon.icon is manually referenced in the pbxproj as a Resource.
          # Re-add via Xcode's + button after any xcodegen regeneration.
          - "chalk_app_icon.icon"
          - "chalk_app_icon.icon/**"
    entitlements:
      path: Chalk/Chalk.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.security.application-groups:
          - group.com.chalkweekly.app
    info:
      path: Chalk/Info.plist
      properties:
        CFBundleName: Chalk
        CFBundleDisplayName: Chalk
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSHealthShareUsageDescription: "Chalk reads your workout history to track your weekly goals."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chalkweekly.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: chalk_app_icon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: ChalkWidgetExtension
        embed: true
      - target: ChalkWatch
        embed: true
        codeSign: true

  # ───────────────────────────────────────────────────────
  # WidgetKit Extension
  # ───────────────────────────────────────────────────────
  ChalkWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Chalk/Widgets/ChalkWidgetExtension
        excludes:
          - "**/.gitkeep"
      - path: Chalk/Shared
        excludes:
          - "**/.gitkeep"
    entitlements:
      path: Chalk/Widgets/ChalkWidgetExtension/ChalkWidgetExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.chalkweekly.app
    info:
      path: Chalk/Widgets/ChalkWidgetExtension/Info.plist
      properties:
        CFBundleName: ChalkWidget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chalkweekly.app.widget
        APPLICATION_EXTENSION_API_ONLY: YES

  # ───────────────────────────────────────────────────────
  # watchOS Companion App  (Phase 5 placeholder)
  # ───────────────────────────────────────────────────────
  ChalkWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: ChalkWatch
        excludes:
          - "**/.gitkeep"
    entitlements:
      path: ChalkWatch/ChalkWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: ChalkWatch/Info.plist
      properties:
        CFBundleName: Chalk
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.chalkweekly.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chalkweekly.app.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
